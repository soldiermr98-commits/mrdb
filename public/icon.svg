<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="loomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="50%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background rounded squircle with warm Persian terracotta gradient -->
  <rect width="512" height="512" rx="112" fill="url(#loomGrad)" />
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />

  <!-- Artisan Handwoven Loom & Textile Knot Motifs -->
  <!-- Outer diamond border inspired by Iranian kilim patterns -->
  <polygon points="256,64 432,256 256,448 80,256" fill="none" stroke="#fed7aa" stroke-width="8" stroke-dasharray="16,10" opacity="0.6"/>
  <polygon points="256,88 408,256 256,424 104,256" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.8"/>

  <!-- Vertical warp threads (تار و پود) -->
  <line x1="180" y1="140" x2="180" y2="372" stroke="#ffedd5" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="218" y1="140" x2="218" y2="372" stroke="#ffedd5" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="256" y1="120" x2="256" y2="392" stroke="#fef08a" stroke-width="6" stroke-linecap="round" />
  <line x1="294" y1="140" x2="294" y2="372" stroke="#ffedd5" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="332" y1="140" x2="332" y2="372" stroke="#ffedd5" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- Central Persian Traditional Knot / Toranj geometric motif -->
  <polygon points="256,160 316,220 316,292 256,352 196,292 196,220" fill="#78350f" stroke="url(#goldGrad)" stroke-width="6"/>
  <polygon points="256,188 296,228 296,284 256,324 216,284 216,228" fill="#c2410c" stroke="#fed7aa" stroke-width="3"/>

  <!-- Weaving shuttle & needle symbol in gold -->
  <circle cx="256" cy="256" r="22" fill="url(#goldGrad)" />
  <circle cx="256" cy="256" r="10" fill="#78350f" />

  <!-- Accent star points for traditional handcraft feel -->
  <polygon points="256,140 262,150 256,155 250,150" fill="#fef08a"/>
  <polygon points="256,372 262,362 256,357 250,362" fill="#fef08a"/>
  <polygon points="176,256 186,262 191,256 186,250" fill="#fef08a"/>
  <polygon points="336,256 326,262 321,256 326,250" fill="#fef08a"/>
</svg>
